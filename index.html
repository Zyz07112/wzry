<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王者荣耀闯关答题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eaf4ff url("bg.jpg") center/cover no-repeat fixed;
    overflow: hidden;
  }

  /* ====== 开场视频层 ====== */
  #videoLayer {
    position: fixed; inset: 0; z-index: 999;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .6s ease;
  }
  #videoLayer video {
    width: 100%; height: 100%; object-fit: contain;
    background: #000;
  }
  #videoLayer.fade-out { opacity: 0; pointer-events: none; }

  /* ====== 自定义过渡图页 ====== */
  #transitionLayer {
    position: fixed; inset: 0; z-index: 998;
    background: #000;
    display: none;
    align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity .6s ease;
  }
  #transitionLayer.show { display: flex; }
  #transitionLayer.fade-out { opacity: 0; pointer-events: none; }
  #transitionLayer img {
    width: 100%; height: 100%; object-fit: contain;
  }
  #transitionLayer .hint {
    position: absolute; bottom: 40px; left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,0.7);
    font-size: 14px; letter-spacing: 2px;
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity: 0.4; }
    50%     { opacity: 1; }
  }

  /* ====== 右上角 baby 蓝小喇叭 ====== */
  #bgmBtn {
    position: fixed; top: 18px; right: 18px; z-index: 1000;
    width: 46px; height: 46px; border-radius: 50%;
    border: none; cursor: pointer;
    background: #bfe3ff;
    box-shadow: 0 4px 14px rgba(120,180,240,0.35);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, background .2s;
    -webkit-tap-highlight-color: transparent;
  }
  #bgmBtn:hover { transform: scale(1.08); background: #a9d8ff; }
  #bgmBtn:active { transform: scale(0.95); }
  #bgmBtn svg { width: 24px; height: 24px; fill: #ffffff; }
  #bgmBtn.playing { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 4px 14px rgba(120,180,240,0.35); }
    50%     { box-shadow: 0 4px 22px rgba(120,180,240,0.75); }
  }

  /* ====== 答题卡片 ====== */
  .card {
    width: min(92vw, 520px);
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 12px 40px rgba(120,170,220,0.25);
    opacity: 0; transform: translateY(20px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .card.show { opacity: 1; transform: translateY(0); }

  .progress {
    height: 10px; background: #dbeafe; border-radius: 99px; overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-bar {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg,#93c5fd,#60a5fa);
    transition: width .35s ease;
  }
  .q-index { font-size: 13px; color: #60a5fa; margin-bottom: 10px; letter-spacing: 1px; }
  .question { font-size: 20px; color: #1e3a5f; line-height: 1.5; margin-bottom: 22px; font-weight: 600; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    padding: 14px 18px; border-radius: 14px; cursor: pointer;
    background: #f0f7ff; border: 2px solid transparent;
    color: #2c4a6e; font-size: 16px; transition: all .2s;
  }
  .option:hover { background: #e0efff; transform: translateY(-1px); }
  .option.correct { background: #d1fae5; border-color: #34d399; color: #065f46; }
  .option.wrong { background: #fee2e2; border-color: #f87171; color: #991b1b; }
  .option.disabled { pointer-events: none; }
  .tip { margin-top: 16px; font-size: 14px; min-height: 20px; text-align: center; }
  .tip.ok { color: #059669; }
  .tip.no { color: #dc2626; }
  .end-screen { display: none; text-align: center; }
  .end-screen img { width: 100%; border-radius: 18px; margin-bottom: 16px; }
  .end-screen p { color: #1e3a5f; font-size: 18px; font-weight: 600; }
  .hidden { display: none; }
</style>
</head>
<body>

<!-- ====== 右上角 baby 蓝小喇叭 ====== -->
<button id="bgmBtn" title="点击播放/暂停背景音乐" aria-label="背景音乐开关">
  <svg viewBox="0 0 24 24">
    <path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a6.5 6.5 0 0 1 0 13.42v2.06a8.5 8.5 0 0 0 0-17.54z"/>
  </svg>
</button>

<!-- ====== 开场视频 ====== -->
<div id="videoLayer">
  <video id="introVideo" src="intro.mp4" playsinline preload="auto"></video>
</div>

<!-- ====== 自定义过渡图页（点击进入答题） ====== -->
<div id="transitionLayer">
  < img src="transition.jpg" alt="过渡图">
  <div class="hint">点击任意处继续</div>
</div>

<!-- ====== 答题卡片 ====== -->
<div class="card" id="card">
  <div id="quizArea">
    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <div class="q-index" id="qIndex"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="tip" id="tip"></div>
  </div>

  <div class="end-screen" id="endScreen">
    <img src="reward.jpg" alt="通关奖励">
    <p>🎉 恭喜通关！王者大神就是你！</p >
  </div>
</div>

<script>
  // ====== 5道王者荣耀题目 ======
  const questions = [
    {
      q: "王者荣耀中，哪位英雄的定位是“法师/刺客”，且大招可以隐身？",
      options: ["妲己", "兰陵王", "安琪拉", "王昭君"],
      answer: 1
    },
    {
      q: "“峡谷第一辅助”通常指的是哪位英雄？",
      options: ["蔡文姬", "瑶", "大乔", "鬼谷子"],
      answer: 0
    },
    {
      q: "王者荣耀中，防御塔的攻击会随着什么而增强？",
      options: ["游戏时间", "击杀数", "经济差", "推塔数量"],
      answer: 0
    },
    {
      q: "以下哪位英雄拥有“复活”机制？",
      options: ["后羿", "太乙真人", "鲁班七号", "孙悟空"],
      answer: 1
    },
    {
      q: "王者荣耀中，红buff的主要效果是什么？",
      options: ["减速敌人", "增加法术强度", "普攻附带真实伤害并减速", "回复生命值"],
      answer: 2
    }
  ];

  let current = 0;
  let score = 0;

  const bar = document.getElementById('bar');
  const qIndex = document.getElementById('qIndex');
  const questionEl = document.getElementById('question');
  const optionsEl = document.getElementById('options');
  const tipEl = document.getElementById('tip');
  const quizArea = document.getElementById('quizArea');
  const endScreen = document.getElementById('endScreen');
  const card = document.getElementById('card');
  const videoLayer = document.getElementById('videoLayer');
  const introVideo = document.getElementById('introVideo');
  const bgmBtn = document.getElementById('bgmBtn');
  const transitionLayer = document.getElementById('transitionLayer');

  // ====== BGM ======
  const bgm = new Audio('bgm.mp3');
  bgm.loop = true;
  bgm.volume = 0.45;
  let bgmStarted = false;

  bgmBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!bgmStarted) {
      bgm.play().then(() => {
        bgmStarted = true;
        bgmBtn.classList.add('playing');
        bgmBtn.title = '背景音乐播放中';
      }).catch(() => {
        bgmBtn.title = '音乐加载失败，请检查 bgm.mp3';
      });
    } else {
      bgm.muted = !bgm.muted;
      bgmBtn.classList.toggle('playing', !bgm.muted);
      bgmBtn.title = bgm.muted ? '已静音（点击恢复）' : '背景音乐播放中';
    }
  });

  // ====== 音效 ======
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function playCorrect() {
    const ctx = getCtx();
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.1;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.25);
    });
  }
  function playWrong() {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.35);
  }
  function playFinish() {
    const ctx = getCtx();
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.14;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.35);
    });
  }

  // ====== 流程：视频 → 过渡图 → 答题 ======
  function startVideo() {
    introVideo.muted = false;
    const p = introVideo.play();
    if (p && p.catch) {
      p.catch(() => {
        introVideo.muted = true;
        introVideo.play().catch(() => showTransition());
      });
    }
  }

  function endVideo() {
    videoLayer.classList.add('fade-out');
    setTimeout(() => {
      videoLayer.style.display = 'none';
      showTransition();          // 视频结束 → 显示过渡图
    }, 600);
  }

  function showTransition() {
    transitionLayer.classList.add('show');
    transitionLayer.classList.remove('fade-out');
  }

  function enterQuiz() {
    transitionLayer.classList.add('fade-out');
    setTimeout(() => {
      transitionLayer.classList.remove('show');
      card.classList.add('show');
      render();
    }, 600);
  }

  introVideo.addEventListener('ended', endVideo);
  introVideo.addEventListener('error', endVideo);

  // 点视频层跳过视频 → 也进入过渡图
  videoLayer.addEventListener('click', () => {
    if (!videoLayer.classList.contains('fade-out')) {
      introVideo.pause();
      endVideo();
    }
  });

  // 点过渡图 → 进入答题
  transitionLayer.addEventListener('click', () => {
    if (!transitionLayer.classList.contains('fade-out')) {
      enterQuiz();
    }
  });

  // ====== 答题逻辑 ======
  function render() {
    const item = questions[current];
    bar.style.width = (current / questions.length * 100) + '%';
    qIndex.textContent = `第 ${current + 1} / ${questions.length} 关`;
    questionEl.textContent = item.q;
    tipEl.textContent = '';
    tipEl.className = 'tip';
    optionsEl.innerHTML = '';

    item.options.forEach((text, i) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.textContent = text;
      div.onclick = () => choose(i, div);
      optionsEl.appendChild(div);
    });
  }

  function choose(i, el) {
    const item = questions[current];
    const all = optionsEl.querySelectorAll('.option');
    all.forEach(o => o.classList.add('disabled'));

    if (i === item.answer) {
      el.classList.add('correct');
      tipEl.textContent = '答对啦！';
      tipEl.classList.add('ok');
      score++;
      playCorrect();
    } else {
      el.classList.add('wrong');
      all[item.answer].classList.add('correct');
      tipEl.textContent = '答错了，正确答案已标出';
      tipEl.classList.add('no');
      playWrong();
    }

    setTimeout(() => {
      current++;
      if (current < questions.length) {
        render();
      } else {
        finish();
      }
    }, 1000);
  }

  function finish() {
    bar.style.width = '100%';
    quizArea.classList.add('hidden');
    endScreen.style.display = 'block';
    playFinish();
  }

  // ====== 启动 ======
  startVideo();
</script>
</body>
</html>
